# DigitalOcean Managed Agents (Open Harness) spec — doctl docs & knowledge-base curator.
#
# Rendered by scripts/04-create-trigger.sh: variable placeholders come from .env / .state.env and
# the runbook placeholder under skills.instructions is replaced with agent/prompts/curator.md.
# Schema per the Managed Agents Design Partner Guide (Aug 2026).

name: ${AGENT_NAME}
agent: claude-code                 # codex | opencode | claude-code | langgraph
template: coding                   # Git, Node, Python toolchain
size: ${AGENT_SIZE}                # see: GET /v2/agents/sessions/sandbox/sizes
persistent_workspace: true

# Repos the session may work with (authenticated through the team's GitHub OAuth connection).
repos:
  - ${GITHUB_OWNER}/${APP_REPO}

# Non-sensitive configuration only. Values here are stored as-is and are debug-readable
# inside the sandbox, so no credentials.
env:
  # The agent's own model, served by DigitalOcean Serverless Inference.
  HARNESS_INFERENCE_BASE_URL: "https://inference.do-ai.run/v1"
  HARNESS_INFERENCE_MODEL: ${AGENT_MODEL}
  ANTHROPIC_MODEL: ${AGENT_MODEL}          # the claude-code adapter also reads this name
  # Curator inputs (read by the runbook and the scripts in the app repo).
  SOURCE_REPO: digitalocean/doctl
  GITHUB_OWNER: ${GITHUB_OWNER}
  APP_REPO: ${APP_REPO}
  KB_UUID: ${KB_UUID}
  KB_DATA_SOURCE_UUID: ${KB_DATA_SOURCE_UUID}
  SPACES_BUCKET: ${SPACES_BUCKET}
  SPACES_REGION: ${SPACES_REGION}
  SPACES_PREFIX: ${SPACES_PREFIX}
  # Git identity for the commits the agent makes.
  GIT_AUTHOR_NAME: "doctl docs curator (Managed Agent)"
  GIT_AUTHOR_EMAIL: "docs-curator@users.noreply.github.com"
  GIT_COMMITTER_NAME: "doctl docs curator (Managed Agent)"
  GIT_COMMITTER_EMAIL: "docs-curator@users.noreply.github.com"

# Credentials. Routed to DigitalOcean Secrets Manager at create time; write-only, never
# returned by any API call, not written to platform logs or traces.
secrets:
  HARNESS_INFERENCE_API_KEY: "${MODEL_ACCESS_KEY}"     # Serverless Inference model access key
  GITHUB_TOKEN: "oauth/github"                         # minted from `doctl agent auth github`
  DIGITALOCEAN_ACCESS_TOKEN: "${DO_API_TOKEN}"         # KB indexing jobs + retrieve check
  SPACES_ACCESS_KEY: "${SPACES_ACCESS_KEY}"
  SPACES_SECRET_KEY: "${SPACES_SECRET_KEY}"

# Policy. Triggered runs are unattended, so `ask` is not available (the platform rejects
# it at trigger creation). Allow by default and deny the things a curator must never do.
# Rules match literally on commands, so cover the obvious variants.
permissions:
  default: allow
  rules:
    - tool: bash
      match: { command: "rm -rf *" }
      action: deny
    - tool: bash
      match: { command: "git push --force*" }
      action: deny
    - tool: bash
      match: { command: "git push -f *" }
      action: deny
    - tool: bash
      match: { command: "git push * --force*" }
      action: deny
    - tool: bash
      match: { command: "curl * | sh" }
      action: deny
    - tool: bash
      match: { command: "curl * | bash" }
      action: deny

# The runbook travels with the agent as a skill: the trigger prompt just invokes it.
skills:
  - name: doctl-docs-curator
    description: Use when asked to curate doctl docs, process new doctl releases, or refresh the doctl support knowledge base.
    instructions: |
__CURATOR_RUNBOOK__
    metadata: { author: digitalocean-demo }
    allowed_tools: [bash, file.read, file.write]
