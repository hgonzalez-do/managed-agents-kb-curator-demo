# DigitalOcean Managed Agents (MARS / Open Harness) agent spec — doctl docs & KB curator.
#
# Rendered by scripts/render-agent-spec.sh (or 04/06): variable placeholders are expanded
# from .env / .state.env and the runbook placeholder under skills.instructions is replaced
# with agent/prompts/curator.md. Import the rendered file in the console, save it as a
# reusable Agent Config (`doctl agent config create --spec`), or pass it to
# `doctl agent start` / `doctl agent triggers create`.

# --- identity ---------------------------------------------------------------
name: ${AGENT_NAME}
description: Weekly curator that turns doctl release notes into support docs, syncs them to Spaces and re-indexes the Gradient Knowledge Base behind the doctl support bot.
labels:
  demo: managed-agents-kb-curator
  owner: ${GITHUB_OWNER}

# --- runtime ----------------------------------------------------------------
agent: claude-code            # claude-code | opencode | codex | hermes | langgraph | custom
model: ${AGENT_MODEL}         # DO-hosted model, served by Serverless Inference

# --- workspace / env --------------------------------------------------------
repos:                        # first entry is the repo hint
  - ${GITHUB_OWNER}/${APP_REPO}          # the docs live here (written by the agent)
  - ${GITHUB_OWNER}/${CURATOR_REPO}      # this repo: curator/ tooling (read-only for the agent)

env:                          # plaintext, non-secret only (debug-readable in the sandbox)
  HARNESS_INFERENCE_BASE_URL: "https://inference.do-ai.run/v1"
  HARNESS_INFERENCE_MODEL: ${AGENT_MODEL}
  ANTHROPIC_MODEL: ${AGENT_MODEL}         # the claude-code adapter reads the model name from here too
  SOURCE_REPO: digitalocean/doctl
  GITHUB_OWNER: ${GITHUB_OWNER}
  APP_REPO: ${APP_REPO}
  CURATOR_REPO: ${CURATOR_REPO}
  KB_UUID: ${KB_UUID}
  KB_DATA_SOURCE_UUID: ${KB_DATA_SOURCE_UUID}
  SPACES_BUCKET: ${SPACES_BUCKET}
  SPACES_REGION: ${SPACES_REGION}
  SPACES_PREFIX: ${SPACES_PREFIX}
  GIT_AUTHOR_NAME: "doctl docs curator (Managed Agent)"
  GIT_AUTHOR_EMAIL: "docs-curator@users.noreply.github.com"
  GIT_COMMITTER_NAME: "doctl docs curator (Managed Agent)"
  GIT_COMMITTER_EMAIL: "docs-curator@users.noreply.github.com"

# --- secrets ----------------------------------------------------------------
# Slot name = guest env var. Values are write-only tenant secrets stored in Secrets Manager
# and never echoed.
# GITHUB_TOKEN: by default the brokered OAuth slot (doctl agent auth github), which carries the
# connected account's full repo access. NOTE: in the current preview the oauth/github slot is
# accepted but not yet enforced, so prefer GITHUB_FINE_GRAINED_PAT in .env: a fine-grained PAT
# scoped to this one repo (Contents: read/write). The renderer substitutes it here as a tenant
# secret, which also locks the agent to that repository at the credential level.
secrets:
  HARNESS_INFERENCE_API_KEY: "${MODEL_ACCESS_KEY}"     # Serverless Inference model access key
  GITHUB_TOKEN: "oauth/github"
  DIGITALOCEAN_ACCESS_TOKEN: "${DO_API_TOKEN}"         # KB indexing jobs + retrieve check
  SPACES_ACCESS_KEY: "${SPACES_ACCESS_KEY}"
  SPACES_SECRET_KEY: "${SPACES_SECRET_KEY}"

# --- execution environment --------------------------------------------------
size: ${AGENT_SIZE}           # GET /v2/agents/sessions/sandbox/sizes
persistent_workspace: true    # keep the clone across suspends (attended sessions)
idle_timeout: 15m             # suspend after idle
max_lifetime: 1h              # hard ceiling for a curator run
# Tighten egress once a run has been observed end to end (request only; server narrows):
# egress:
#   - github.com
#   - api.github.com
#   - api.digitalocean.com
#   - kbaas.do-ai.run
#   - inference.do-ai.run
#   - ${SPACES_REGION}.digitaloceanspaces.com
#   - ${SPACES_BUCKET}.${SPACES_REGION}.digitaloceanspaces.com
#   - pypi.org
#   - files.pythonhosted.org

# --- tools (Action Gateway) -------------------------------------------------
# Optional v2: give the agent GitHub and web access through Action Gateway instead of tokens
# in the sandbox. Credentials then never enter the sandbox or the model context. Accepted but
# not yet enforced in the preview; see docs/action-gateway-variant.md before enabling.
# tools:
#   - do.actions: [github, exa_web_fetch]
# (and add a permissions rule:  - { tool: mcp, action: allow })

# --- skills -----------------------------------------------------------------
# The runbook travels with the agent as a skill (accepted, not yet enforced in the preview),
# and is also sent in full as the trigger / session prompt.
skills:
  - name: doctl-docs-curator
    description: Use when asked to curate doctl docs, process new doctl releases, or refresh the doctl support knowledge base.
    instructions: |
__CURATOR_RUNBOOK__
    metadata:
      author: digitalocean-demo
    allowed_tools: [bash, file.read, file.write]

# --- permissions ------------------------------------------------------------
# Triggered runs are unattended, so `ask` is not allowed (rejected at trigger creation).
# Allow by default; strict deny on anything a curator must never do. Rules match literally
# and most-specific wins, so the repo-scoped allows below beat the generic denies.
# Validate on a live session before relying on it (ask the agent to clone another repo).
permissions:
  default: allow
  rules:
    # -- git is confined to this one repository and branch --
    - tool: bash
      match: { command: "git clone https://github.com/${GITHUB_OWNER}/${APP_REPO}*" }
      action: allow
    - tool: bash
      match: { command: "git clone https://github.com/${GITHUB_OWNER}/${CURATOR_REPO}*" }
      action: allow
    - tool: bash
      match: { command: "git clone *" }
      action: deny
      enforcement: strict
    - tool: bash
      match: { command: "git push origin main" }
      action: allow
    - tool: bash
      match: { command: "*git push*" }
      action: deny
      enforcement: strict
    - tool: bash
      match: { command: "git remote add *" }
      action: deny
      enforcement: strict
    - tool: bash
      match: { command: "git remote set-url *" }
      action: deny
      enforcement: strict
    - tool: bash
      match: { command: "gh *" }                 # no GitHub CLI: it could reach any repo
      action: deny
      enforcement: strict
    # -- destructive or unsafe commands --
    - tool: bash
      match: { command: "rm -rf *" }
      action: deny
      enforcement: strict
    - tool: bash
      match: { command: "curl * | sh" }
      action: deny
      enforcement: strict
    - tool: bash
      match: { command: "curl * | bash" }
      action: deny
      enforcement: strict
  filesystem:
    mode: workspace-write
    allow_write: [/tmp]

# --- budget (advisory ceilings) ---------------------------------------------
budget:
  max_cost_usd: 5.0
  max_steps: 300
  max_wall_clock: 45m
  on_breach: pause

mode: interactive
